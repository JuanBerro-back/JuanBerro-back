<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D8EA;stop-opacity:1">
        <animate attributeName="stop-color" values="#A8D8EA;#C5E8F7;#D4ECFC;#A8D8EA" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#C5E8F7;stop-opacity:1">
        <animate attributeName="stop-color" values="#C5E8F7;#FDEBD0;#E8DAEF;#C5E8F7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FDEBD0;stop-opacity:1">
        <animate attributeName="stop-color" values="#FDEBD0;#E8DAEF;#A8D8EA;#FDEBD0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B86E5"/>
      <stop offset="100%" style="stop-color:#36D1DC"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1">
        <animate attributeName="stop-color" values="#667eea;#764ba2;#f093fb;#667eea" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1">
        <animate attributeName="stop-color" values="#764ba2;#f093fb;#667eea;#764ba2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      75% { transform: rotate(-5deg); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-8deg); }
      60% { transform: rotate(5deg); }
    }
    .pochacco-body { animation: float 3s ease-in-out infinite; }
    .star { animation: sparkle 2s ease-in-out infinite; }
    .heart { animation: heartbeat 1.5s ease-in-out infinite; }
    .text-hello { animation: bounce 2s ease-in-out infinite; }
    .text-name { animation: floatSlow 3.5s ease-in-out infinite; }
    .wave-paw { animation: wave 1.2s ease-in-out infinite; transform-origin: 135px 185px; }
    .ear-left { animation: earWiggle 2.5s ease-in-out infinite; transform-origin: 75px 110px; }
    .twinkle1 { animation: twinkle 1.8s ease-in-out infinite; }
    .twinkle2 { animation: twinkle 2.2s ease-in-out infinite 0.5s; }
    .twinkle3 { animation: twinkle 1.5s ease-in-out infinite 1s; }
    .twinkle4 { animation: twinkle 2s ease-in-out infinite 0.3s; }
    .flower { animation: sparkle 3s ease-in-out infinite 0.7s; }
    .badge { animation: floatSlow 4s ease-in-out infinite; }
    .typing-cursor { animation: twinkle 0.8s step-end infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle pattern dots -->
  <g opacity="0.08">
    <circle cx="50" cy="50" r="3" fill="#5B86E5"/>
    <circle cx="150" cy="30" r="2" fill="#5B86E5"/>
    <circle cx="250" cy="70" r="3" fill="#5B86E5"/>
    <circle cx="350" cy="20" r="2" fill="#5B86E5"/>
    <circle cx="450" cy="60" r="3" fill="#5B86E5"/>
    <circle cx="550" cy="40" r="2" fill="#5B86E5"/>
    <circle cx="650" cy="80" r="3" fill="#5B86E5"/>
    <circle cx="750" cy="25" r="2" fill="#5B86E5"/>
    <circle cx="850" cy="55" r="3" fill="#5B86E5"/>
    <circle cx="100" cy="280" r="2" fill="#5B86E5"/>
    <circle cx="300" cy="270" r="3" fill="#5B86E5"/>
    <circle cx="500" cy="285" r="2" fill="#5B86E5"/>
    <circle cx="700" cy="275" r="3" fill="#5B86E5"/>
    <circle cx="800" cy="260" r="2" fill="#5B86E5"/>
  </g>

  <!-- ========== POCHACCO CHARACTER ========== -->
  <g class="pochacco-body" filter="url(#softShadow)">
    <!-- Body -->
    <ellipse cx="110" cy="215" rx="55" ry="50" fill="white" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Head -->
    <circle cx="110" cy="150" r="52" fill="white" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Left ear -->
    <g class="ear-left">
      <ellipse cx="62" cy="115" rx="22" ry="35" fill="#3A3A3A" transform="rotate(-30 62 115)"/>
    </g>
    <!-- Right ear -->
    <ellipse cx="158" cy="115" rx="22" ry="35" fill="#3A3A3A" transform="rotate(30 158 115)"/>
    <!-- Hair tuft -->
    <ellipse cx="110" cy="100" rx="8" ry="10" fill="white"/>
    <ellipse cx="104" cy="103" rx="5" ry="8" fill="white"/>
    <ellipse cx="116" cy="103" rx="5" ry="8" fill="white"/>
    <!-- Eyes -->
    <circle cx="93" cy="148" r="6" fill="#2C2C2C"/>
    <circle cx="127" cy="148" r="6" fill="#2C2C2C"/>
    <circle cx="95" cy="146" r="2" fill="white"/>
    <circle cx="129" cy="146" r="2" fill="white"/>
    <!-- Nose -->
    <ellipse cx="110" cy="158" rx="4" ry="3" fill="#2C2C2C"/>
    <!-- Smile -->
    <path d="M100 163 Q110 172 120 163" fill="none" stroke="#2C2C2C" stroke-width="2" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="82" cy="160" rx="8" ry="5" fill="#FFB5B5" opacity="0.5"/>
    <ellipse cx="138" cy="160" rx="8" ry="5" fill="#FFB5B5" opacity="0.5"/>
    <!-- Blue shirt -->
    <path d="M70 200 Q70 240 110 245 Q150 240 150 200 Q145 190 110 188 Q75 190 70 200Z" fill="#7EC8E3" stroke="#6BB8D3" stroke-width="1"/>
    <!-- Left paw -->
    <ellipse cx="68" cy="210" rx="14" ry="10" fill="white" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Right paw waving -->
    <g class="wave-paw">
      <ellipse cx="152" cy="195" rx="14" ry="10" fill="white" stroke="#E0E0E0" stroke-width="1" transform="rotate(-20 152 195)"/>
    </g>
    <!-- Feet -->
    <ellipse cx="85" cy="252" rx="18" ry="10" fill="white" stroke="#E0E0E0" stroke-width="1"/>
    <ellipse cx="135" cy="252" rx="18" ry="10" fill="white" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Toe beans -->
    <circle cx="78" cy="250" r="2.5" fill="#E8D5D5"/>
    <circle cx="85" cy="248" r="2.5" fill="#E8D5D5"/>
    <circle cx="92" cy="250" r="2.5" fill="#E8D5D5"/>
    <circle cx="128" cy="250" r="2.5" fill="#E8D5D5"/>
    <circle cx="135" cy="248" r="2.5" fill="#E8D5D5"/>
    <circle cx="142" cy="250" r="2.5" fill="#E8D5D5"/>
  </g>

  <!-- ========== DECORATIONS ========== -->
  <!-- Stars -->
  <g class="star" style="animation-delay: 0s;">
    <polygon points="30,35 33,28 36,35 43,35 38,40 40,47 33,43 26,47 28,40 23,35" fill="#FFD700" opacity="0.8"/>
  </g>
  <g class="star" style="animation-delay: 0.7s;">
    <polygon points="185,45 187,40 189,45 194,45 190,48 191,53 187,50 183,53 184,48 180,45" fill="#FFD700" opacity="0.7" transform="scale(0.8)"/>
  </g>
  <g class="star" style="animation-delay: 1.2s;">
    <polygon points="200,270 202,265 204,270 209,270 205,273 206,278 202,275 198,278 199,273 195,270" fill="#FFD700" opacity="0.6"/>
  </g>

  <!-- Hearts -->
  <g class="heart" style="animation-delay: 0.3s;">
    <path d="M175 80 C175 75, 182 72, 182 78 C182 72, 189 75, 189 80 C189 86, 182 92, 182 92 C182 92, 175 86, 175 80Z" fill="#FF8FA3" opacity="0.7"/>
  </g>
  <g class="heart" style="animation-delay: 0.9s;">
    <path d="M42 250 C42 246, 47 244, 47 248 C47 244, 52 246, 52 250 C52 254, 47 258, 47 258 C47 258, 42 254, 42 250Z" fill="#FFB5C5" opacity="0.6"/>
  </g>

  <!-- Flowers -->
  <g class="flower" transform="translate(25, 180)">
    <circle cx="0" cy="-5" r="4" fill="#FFDAB9"/>
    <circle cx="5" cy="0" r="4" fill="#FFDAB9"/>
    <circle cx="0" cy="5" r="4" fill="#FFDAB9"/>
    <circle cx="-5" cy="0" r="4" fill="#FFDAB9"/>
    <circle cx="0" cy="0" r="3" fill="#FFE4B5"/>
  </g>
  <g class="flower" transform="translate(190, 260)" style="animation-delay: 1.5s;">
    <circle cx="0" cy="-4" r="3.5" fill="#FFB6C1"/>
    <circle cx="4" cy="0" r="3.5" fill="#FFB6C1"/>
    <circle cx="0" cy="4" r="3.5" fill="#FFB6C1"/>
    <circle cx="-4" cy="0" r="3.5" fill="#FFB6C1"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFDAB9"/>
  </g>

  <!-- Sparkle diamonds -->
  <g class="twinkle1">
    <path d="M170 130 L172 125 L174 130 L179 132 L174 134 L172 139 L170 134 L165 132Z" fill="white" opacity="0.8"/>
  </g>
  <g class="twinkle2">
    <path d="M50 90 L51 87 L52 90 L55 91 L52 92 L51 95 L50 92 L47 91Z" fill="white" opacity="0.7"/>
  </g>
  <g class="twinkle3">
    <path d="M195 185 L196 182 L197 185 L200 186 L197 187 L196 190 L195 187 L192 186Z" fill="white" opacity="0.6"/>
  </g>

  <!-- ========== TEXT CONTENT ========== -->
  <g class="text-hello">
    <text x="350" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">
      Hola! I'm
    </text>
  </g>

  <g class="text-name">
    <text x="350" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="900" fill="url(#nameGrad)" filter="url(#glow)">
      JuanBerro-back
    </text>
  </g>

  <text x="350" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#5A6B7F" font-weight="500" opacity="0.9">
    Full Stack Developer
    <tspan class="typing-cursor" fill="#667eea">|</tspan>
  </text>

  <!-- Tech badges -->
  <g class="badge">
    <rect x="350" y="195" rx="12" ry="12" width="80" height="26" fill="#2C2C2C" opacity="0.85"/>
    <text x="390" y="213" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Code</text>

    <rect x="440" y="195" rx="12" ry="12" width="95" height="26" fill="#667eea" opacity="0.85"/>
    <text x="487" y="213" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Creative</text>

    <rect x="545" y="195" rx="12" ry="12" width="90" height="26" fill="#36D1DC" opacity="0.85"/>
    <text x="590" y="213" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Passion</text>

    <rect x="645" y="195" rx="12" ry="12" width="105" height="26" fill="#f093fb" opacity="0.7"/>
    <text x="697" y="213" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Cloud</text>
  </g>

  <text x="350" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#7B8FA3" font-weight="400" opacity="0.8">
    Bienvenido a mi perfil de GitHub
  </text>

  <!-- Right side decorations -->
  <g class="twinkle4">
    <path d="M820 60 L822 54 L824 60 L830 62 L824 64 L822 70 L820 64 L814 62Z" fill="#FFD700" opacity="0.5"/>
  </g>
  <g class="star" style="animation-delay: 1.8s;">
    <polygon points="780,250 782,245 784,250 789,250 785,253 786,258 782,255 778,258 779,253 775,250" fill="#FFD700" opacity="0.4"/>
  </g>
  <g class="heart" style="animation-delay: 1.5s;">
    <path d="M850 150 C850 146, 855 144, 855 148 C855 144, 860 146, 860 150 C860 154, 855 158, 855 158 C855 158, 850 154, 850 150Z" fill="#FF8FA3" opacity="0.5"/>
  </g>
  <g class="flower" transform="translate(830, 230)" style="animation-delay: 2s;">
    <circle cx="0" cy="-3" r="3" fill="#B5EAD7"/>
    <circle cx="3" cy="0" r="3" fill="#B5EAD7"/>
    <circle cx="0" cy="3" r="3" fill="#B5EAD7"/>
    <circle cx="-3" cy="0" r="3" fill="#B5EAD7"/>
    <circle cx="0" cy="0" r="2" fill="#FFDAB9"/>
  </g>

  <!-- Bottom waves -->
  <path d="M0 280 Q100 265 200 278 Q300 290 400 275 Q500 260 600 278 Q700 295 800 272 Q850 265 900 278 L900 300 L0 300Z" fill="white" opacity="0.15"/>
  <path d="M0 288 Q150 275 300 285 Q450 295 600 282 Q750 270 900 285 L900 300 L0 300Z" fill="white" opacity="0.1"/>

  <!-- Border -->
  <rect width="900" height="300" rx="16" fill="none" stroke="#D4E6F1" stroke-width="2" opacity="0.5"/>
</svg>
