<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner - JuanBerro-back</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
    }

    .banner {
      width: 900px;
      height: 320px;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(135,224,253,0.1);
    }

    /* ===== SKY SCENE (Stardew Valley style) ===== */
    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #1a0a3e 0%, #2d1b69 25%, #87e0fd 55%, #05abe0 100%);
      animation: skyShift 12s ease-in-out infinite alternate;
    }

    @keyframes skyShift {
      0% { background: linear-gradient(to bottom, #1a0a3e 0%, #2d1b69 25%, #87e0fd 55%, #05abe0 100%); }
      50% { background: linear-gradient(to bottom, #0f0628 0%, #1a0a3e 20%, #6bc5e8 55%, #05abe0 100%); }
      100% { background: linear-gradient(to bottom, #1a0a3e 0%, #2d1b69 25%, #87e0fd 55%, #05abe0 100%); }
    }

    /* Stars in sky */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55%;
    }

    .stars span {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkleStar 3s ease-in-out infinite alternate;
    }

    .stars span:nth-child(1) { width: 2px; height: 2px; top: 15%; left: 10%; animation-delay: 0s; }
    .stars span:nth-child(2) { width: 3px; height: 3px; top: 8%; left: 25%; animation-delay: 0.5s; }
    .stars span:nth-child(3) { width: 2px; height: 2px; top: 22%; left: 40%; animation-delay: 1s; }
    .stars span:nth-child(4) { width: 1px; height: 1px; top: 5%; left: 55%; animation-delay: 1.5s; }
    .stars span:nth-child(5) { width: 3px; height: 3px; top: 18%; left: 70%; animation-delay: 0.3s; }
    .stars span:nth-child(6) { width: 2px; height: 2px; top: 10%; left: 85%; animation-delay: 0.8s; }
    .stars span:nth-child(7) { width: 2px; height: 2px; top: 28%; left: 15%; animation-delay: 1.2s; }
    .stars span:nth-child(8) { width: 1px; height: 1px; top: 3%; left: 50%; animation-delay: 2s; }
    .stars span:nth-child(9) { width: 2px; height: 2px; top: 25%; left: 92%; animation-delay: 0.6s; }
    .stars span:nth-child(10) { width: 3px; height: 3px; top: 12%; left: 35%; animation-delay: 1.8s; }
    .stars span:nth-child(11) { width: 2px; height: 2px; top: 20%; left: 60%; animation-delay: 0.2s; }
    .stars span:nth-child(12) { width: 1px; height: 1px; top: 7%; left: 78%; animation-delay: 1.1s; }

    @keyframes twinkleStar {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    /* Moon */
    .moon {
      position: absolute;
      top: 25px;
      right: 80px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fffde7;
      box-shadow: 0 0 20px rgba(255,253,231,0.6), 0 0 40px rgba(255,253,231,0.3);
      animation: moonGlow 4s ease-in-out infinite alternate;
    }

    @keyframes moonGlow {
      0% { box-shadow: 0 0 20px rgba(255,253,231,0.6), 0 0 40px rgba(255,253,231,0.3); }
      100% { box-shadow: 0 0 30px rgba(255,253,231,0.8), 0 0 60px rgba(255,253,231,0.4); }
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.15);
      border-radius: 50px;
      animation: cloudDrift 30s linear infinite;
    }

    .cloud:nth-child(1) { width: 120px; height: 30px; top: 35%; left: -120px; animation-duration: 25s; }
    .cloud:nth-child(2) { width: 80px; height: 20px; top: 42%; left: -80px; animation-duration: 35s; animation-delay: 10s; }
    .cloud:nth-child(3) { width: 100px; height: 25px; top: 30%; left: -100px; animation-duration: 28s; animation-delay: 5s; }

    @keyframes cloudDrift {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(900px + 200px)); }
    }

    /* Ground */
    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(to bottom, #82C942 0%, #5da832 50%, #4a8a28 100%);
    }

    .ground::before {
      content: "";
      position: absolute;
      top: -8px;
      width: 100%;
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        #82C942 0px, #82C942 6px,
        #6db936 6px, #6db936 12px
      );
    }

    /* Flowers on ground */
    .ground-flowers {
      position: absolute;
      bottom: 55px;
      width: 100%;
      height: 15px;
    }

    .ground-flowers span {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: flowerSway 2s ease-in-out infinite alternate;
    }

    .ground-flowers span:nth-child(1) { background: #ff6b9d; left: 8%; animation-delay: 0s; }
    .ground-flowers span:nth-child(2) { background: #ffd93d; left: 18%; animation-delay: 0.3s; }
    .ground-flowers span:nth-child(3) { background: #ff8fa3; left: 32%; animation-delay: 0.7s; }
    .ground-flowers span:nth-child(4) { background: #c9f0ff; left: 65%; animation-delay: 0.5s; }
    .ground-flowers span:nth-child(5) { background: #ffd93d; left: 78%; animation-delay: 0.2s; }
    .ground-flowers span:nth-child(6) { background: #ff6b9d; left: 90%; animation-delay: 0.9s; }
    .ground-flowers span:nth-child(7) { background: #b8ff6b; left: 45%; animation-delay: 0.4s; }

    @keyframes flowerSway {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-3px) scale(1.2); }
    }

    /* ===== PIXEL CAT (Stardew Valley) ===== */
    .cat {
      margin: 0 auto;
      padding: 0;
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      width: 210px;
      height: 170px;
      animation: catMove 20s linear infinite;
      transform: scale(0.45);
      transform-origin: bottom center;
    }

    .cat:after {
      content: "";
      position: absolute;
      top: -10px;
      left: -10px;
      width: 10px;
      height: 10px;
      animation: catwalk 1s steps(4) infinite;
    }

    @keyframes catMove {
      0% { transform: scale(0.45) translateX(-900px); }
      100% { transform: scale(0.45) translateX(900px); }
    }

    /* ===== TEXT OVERLAY (Glassmorphism) ===== */
    .text-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      z-index: 10;
      text-align: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 25px 50px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: floatText 3s ease-in-out infinite;
    }

    @keyframes floatText {
      0%, 100% { transform: translate(-50%, -55%); }
      50% { transform: translate(-50%, -58%); }
    }

    .greeting {
      font-size: 18px;
      color: #c9f0ff;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    .username {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #ffd93d);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease-in-out infinite;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subtitle {
      font-size: 15px;
      color: #e0e0e0;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .subtitle .cursor {
      animation: blink 0.8s step-end infinite;
      color: #667eea;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Badges */
    .badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: white;
      letter-spacing: 0.5px;
      animation: badgePulse 3s ease-in-out infinite;
    }

    .badge:nth-child(1) { background: rgba(102,126,234,0.7); animation-delay: 0s; }
    .badge:nth-child(2) { background: rgba(240,147,251,0.7); animation-delay: 0.3s; }
    .badge:nth-child(3) { background: rgba(54,209,220,0.7); animation-delay: 0.6s; }
    .badge:nth-child(4) { background: rgba(255,217,61,0.6); color: #333; animation-delay: 0.9s; }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Welcome text at bottom */
    .welcome {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Shooting star */
    .shooting-star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      top: 10%;
      left: -5%;
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.6);
      animation: shoot 6s linear infinite;
      opacity: 0;
    }

    .shooting-star:nth-child(2) {
      animation-delay: 3s;
      top: 15%;
    }

    @keyframes shoot {
      0% { opacity: 0; transform: translateX(0) translateY(0); }
      5% { opacity: 1; }
      20% { opacity: 0; transform: translateX(400px) translateY(80px); }
      100% { opacity: 0; transform: translateX(400px) translateY(80px); }
    }
